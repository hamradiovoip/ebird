<html lang="en" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/navbar}"></div>




<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />

	<title> [[${title}]] </title>

	<!-- Pulls in all CSS assets from the layout file  -->
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>
	<th:block th:replace="~{fragments/styles :: map-styles}"></th:block>

	<th:block th:replace="~{fragments/bootstrap :: bootstrap-assets}"></th:block>

</head>

<body style="margin:30;padding:2">

	<h5 th:text="${number}"></h5>
	<h5 th:text="${regioncode}"></h5>
	<h5 th:text="${placeName}"></h5>

	<table style="width:55%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>
				<th>Code Name</th>
				<th>Common Name</th>
				</th>



			</tr>
		</thead>
		<tbody>

			<tr th:each="instance : ${map}">
				<td><a th:href="@{https://ebird.org/species/{id}(id=${instance.key})}" target="_blank" th:text="${instance.key}"></a> </td>
				<td th:text="${instance.value}"></td>
			</tr>


			<!--	<tr th:each="bird:${commonlist}">-->

			<!--        <td th:text= "${bird}" ></td>	-->
			<!--	TODO	<td><a th:href="@{https://ebird.org/species/{id}(id=${bird.speciesCode})}" target="_blank" th:text="${bird.comName}"></a> </td>		-->

			<!--  </tr>-->
		</tbody>
	</table>


	<pre>


</pre>

</body>

</html>
