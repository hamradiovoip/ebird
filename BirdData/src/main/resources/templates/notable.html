<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />

	<title>Notable Local Bird Observations</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ==" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js" integrity="sha512-gZwIG9x3wUXg2hdXF6+rVkLF/0Vi9U8D2Ntg4Ga5I5BZpVkVxlJWbSQtXPSiUTtC0TjtGOmxa1AJPuV0CPthew==" crossorigin=""></script>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

	<!--	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
	
	<link rel="stylesheet" href="/static/scripts/lib/leaflet/leaflet.css" />
	<script src="/static/scripts/lib/leaflet/leaflet.js"></script>
	-->

	<style>
		html,
		body {
			height: 100%;
			margin: 0;
		}

		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}

		.my-label {
			position: absolute;
			width: 100px;
			font-size: 20px;
		}
	</style>


</head>

<body style="margin:30;padding:2">

	<div th:replace="~{fragments/navbar}"></div>
</body>

<center><span th:text="${center}" /> </center>

<h5 th:text="${size}"></h5>
<h5 th:text="${location}"></h5>



<table style="width:85%" border="1" class="table table-striped table-responsive-md">
	<thead>
		<tr>
			<th>Common Name </th>
			<th>Sci name </th>
			<th>Number Seen </th>
			<th>Date </th>
			<th>Location </th>
			<th>Checkilist</th>
			<th>Other Local Sightings</th>
		</tr>
	</thead>
	<tbody>

		<tr th:each="bird:${notable}">

			<!--		        <td th:text= "${bird.comName}" ></td>		-->
			<td><a th:href="@{https://ebird.org/species/{id}(id=${bird.speciesCode})}" target="_blank" th:text="${bird.comName}"></a> </td>
			<td th:text="${bird.sciName}"></td>
			<td th:text="${bird.howMany}"></td>
			<td th:text="${bird.obsDt}"></td>

			<td th:text="${bird.locName}"></td>
			<td><a th:href="@{/viewchecklist(subid=${bird.subId},lat=${bird.lat},lon=${bird.lng})}" th:text="${bird.subId}"></a> </td>
			
			<td><a th:href="@{/nearbyspecies(lat=${lat},lon=${lon},back=${back},dist=${dist},speciesCode=${bird.speciesCode})}" th:text="${bird.speciesCode}"></a> </td>
			

		</tr>
	</tbody>
</table>



<div id="mapid" th:attr="style=${mapsize}"></div>

<script th:inline="javascript">
	var mylat = [[${lat}]];
	var mylon = [[${lon}]];

	var zoom = [[${zoom}]];
	var data = [[${pointList}]];
	var dist = [[${dist}]];
	var back = [[${back}]];
	var radius = 2000;


	var mymap = L.map('mapid').setView([mylat, mylon], zoom);

	new L.tileLayer(
		'http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 20
	}).addTo(mymap);

	
	
	for (var i = 0; i < data.length; i++) {

		
		var mapurl = '<a href="/viewchecklist?subid=' + data[i].subId + '&lat='
			+ data[i].lat + '&lon=' + data[i].lon + '">' + data[i].subId  + '</a><p>';

		if (data[i].lat !== null && data[i].lon !== "") {
			// window.alert(data[i]);		

			L.marker([data[i].lat, data[i].lon]).addTo(mymap)
				.bindPopup(
					data[i].textDescription + '<br>' +
					data[i].birdComName + '<br>' + 
					data[i].date + '<br>' + 
					mapurl);
		}
	}

	

	mymap.on('click', function (e) {
		var lt = String(e.latlng.lat), lg = String(e.latlng.lng);
		var name = "link";
		var recents = '<a href="/recent?lat=' + lt + '&lon=' + lg + '&dist=40&back=3' + '">' + "Recent" + '</a>' + '<p>';
		var map = '<a href="/map/?lat=' + lt + '&lon=' + lg + '">' + "Checklist" + '</a><p>';

		var specieslistlink = '<a href="/species?lat=' + lt + '&lon=' + lg + '">' + "Species List (US Only)" + '</a>' + '<p>';
		var checklists = '<a href="/checklist2?lat=' + lt + '&lon=' + lg + '">' + "Checklists (US Only)" + '</a>' + '<p>';
		var hotspots = '<a href="/hotspot?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Hotspot List" + '</a>' + '<p>';
		var notable = '<a href="/notable?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Notable List (US Only)" + '</a>' + '<p>';


		var displaylinks = recents + checklists + specieslistlink + hotspots + notable;

		var popup = L.popup().setLatLng(e.latlng).setContent(displaylinks).openOn(mymap);

	});


	
	
<!--	L.circle([mylat, mylon], { color: 'red', radius: dist*1000, fillOpacity: 0.1}).addTo(mymap);-->

</script>

<pre>


</pre>

</body>

</html>
