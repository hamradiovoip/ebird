<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
	<title>Recent Local Bird Observations</title>

	<!-- Pulls in all CSS assets from the layout file  -->
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>
	<th:block th:replace="~{fragments/styles :: map-styles}"></th:block>
	<th:block th:replace="~{fragments/bootstrap :: bootstrap-assets}"></th:block>
	
</head>

<body style="margin:30;padding:2">

	<div th:replace="~{fragments/navbar}"></div>


<center>Local Recent Bird Observations (<span th:text="${distance}" /> km distance for <span th:text="${days}" /> days)
</center>


Number of checklists: <span th:text="${checklistnumber}" />
<p>
	Bird Species: <span th:text="${noDupSpecices}" />
<p>


<table style="width:95%" border="1" class="table table-striped table-responsive-md">
	<thead>
		<tr>
			<th>Common Name </th>
			<th>Scientific Name </th>
			<th>Numbers </th>
			<th>Date </th>
			<th>Location </th>
			<th>Checkilist</th>
			<th>Other Local Sightings</th>
		</tr>
	</thead>
	<tbody>

		<tr th:each="bird:${recent}">

			<td><a th:href="@{https://ebird.org/species/{id}(id=${bird.speciesCode})}" target="_blank" th:text="${bird.comName}"></a> </td>
			<td th:text="${bird.sciName}"></td>
			<td th:text="${bird.howMany}"></td>
			<td th:text="${bird.obsDt}"></td>
			<td th:text="${bird.locName}"></td>
			<td><a th:href="@{/viewchecklist(subid=${bird.subId},lat=${bird.lat},lon=${bird.lng})}" th:text="${bird.subId}"></a> </td>
			<td><a th:href="@{/nearbyspecies(lat=${lat},lon=${lon},back=${back},dist=50,speciesCode=${bird.speciesCode})}" th:text="${bird.speciesCode}"></a> </td>

		</tr>
	</tbody>
</table>



<div id="mapid" th:attr="style=${mapsize}"></div>


<script th:inline="javascript">
	var mylat = [[${lat}]];
	var mylon = [[${lon}]];
	var zoom = [[${zoom}]];
	var data = [[${pointList}]];
	var dist = [[${dist}]];
	var back = [[${back}]];
	var distance = [[${distance}]];

	var mymap = L.map('mapid').setView([mylat, mylon], zoom);

	new L.tileLayer(
		'http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 20,
		referrerPolicy:origin
	}).addTo(mymap);

	for (var i = 0; i < data.length; i++) {

		var mapurl = '<a href="/viewchecklist?subid=' + data[i].subId + '&lat='
			+ data[i].lat + '&lon=' + data[i].lon + '">' + data[i].subId + '</a><p>';

		if (data[i].lat !== null && data[i].lon !== "") {
			// window.alert(data[i]);		

			L.marker([data[i].lat, data[i].lon]).addTo(mymap)
				.bindPopup(
					data[i].textDescription + '<p>' + mapurl);
		}
	}



	mymap.on('click', function (e) {
		var lt = String(e.latlng.lat), lg = String(e.latlng.lng);
		var name = "link";
		var recents = '<a href="/recent?lat=' + lt + '&lon=' + lg + '&dist=40&back=3' + '">' + "Recent" + '</a>' + '<p>';
		var map = '<a href="/map/?lat=' + lt + '&lon=' + lg + '">' + "Checklist" + '</a><p>';

		var specieslistlink = '<a href="/species?lat=' + lt + '&lon=' + lg + '">' + "Species List (US Only)" + '</a>' + '<p>';
		var checklists = '<a href="/checklist2?lat=' + lt + '&lon=' + lg + '">' + "Checklists (US Only)" + '</a>' + '<p>';
		var hotspots = '<a href="/hotspot?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Hotspot List" + '</a>' + '<p>';
		var notable = '<a href="/notable?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Notable List (US Only)" + '</a>' + '<p>';

		var displaylinks = recents + checklists + specieslistlink + hotspots + notable;

		var popup = L.popup().setLatLng(e.latlng).setContent(displaylinks).openOn(mymap);

	});
	L.circle([mylat, mylon], { color: 'red', radius: distance*1000, fillOpacity: 0.1}).addTo(mymap);

</script>

<a href="https://www.openstreetmap.org"> Maps from OpenStreetMap </a>
<pre>


</pre>

</body>

</html>
