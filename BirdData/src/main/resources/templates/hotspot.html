<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />

	<title>eBird Hotspot List</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ==" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js" integrity="sha512-gZwIG9x3wUXg2hdXF6+rVkLF/0Vi9U8D2Ntg4Ga5I5BZpVkVxlJWbSQtXPSiUTtC0TjtGOmxa1AJPuV0CPthew==" crossorigin=""></script>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>

	<script src="https://code.jquery.com/jquery-1.12.4.js"></script>
	<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
	<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
	
	
	<!--	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
	
	<link rel="stylesheet" href="/static/scripts/lib/leaflet/leaflet.css" />
	<script src="/static/scripts/lib/leaflet/leaflet.js"></script>
	-->

	<style>
		html,
		body {
			height: 100%;
			margin: 0;
		}

		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}

		.my-label {
			position: absolute;
			width: 100px;
			font-size: 20px;
		}
	</style>
</head>

<body style="margin:30;padding:2">

	<div th:replace="~{fragments/navbar}"></div>

	<center><span th:text="${title}"/> </center>
	
	<h5 th:text="${size}"></h5>

	<table style="width:95%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>
				<th>Location Name</th>
				<th>Location Code</th>
				<th>Species</th>
				<th>Checklists For Region</th>
				<th>Date</th>
				<th>Num Species All Time</th>
				<th>Recent Obs</th>
			</tr>
		</thead>
		<tbody>


			<tr th:each="hs:${hotspots}">

				<td th:text="${hs.locName}"></td>
				<td th:text="${hs.subnational2Code}"></td>

				<td><a th:href="@{/speciesregion(region=${hs.subnational2Code})}" th:text="${hs.subnational2Code}"></a>
				</td>
				<td><a th:href="@{/checklistRegion(region=${hs.subnational2Code})}" th:text="${hs.subnational2Code}"></a> </td>


				<td th:text="${hs.latestObsDt}"></td>
				<td th:text="${hs.numSpeciesAllTime}"></td>
				<td><a th:href="@{/recent(lat=${hs.lat},lon=${hs.lng},dist=${dist}, back=${back})}" th:text="${hs.locName}"></a> </td>

			</tr>

		</tbody>
	</table>


	<div id="mapid" th:attr="style=${mapsize}"></div>

	<script th:inline="javascript">
		var mylat = [[${lat}]];
		var mylon = [[${lon}]];
		var zoom = [[${zoom}]];
		var data = [[${hotspots}]];
		var dist = [[${dist}]];
		var back = [[${back}]];

		var mymap = L.map('mapid').setView([mylat, mylon], zoom);

		new L.tileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 20
		}).addTo(mymap);

		L.marker([mylat, mylon]).addTo(mymap).bindPopup('center');


		for (var i = 0; i < data.length; i++) {


			if (data[i].lat !== null && data[i].lng !== "") {
				L.marker([data[i].lat, data[i].lng]).addTo(mymap)
					.bindPopup(data[i].locName + '<p>');
			}
		}



		mymap.on('click', function (e) {
			var lt = String(e.latlng.lat), lg = String(e.latlng.lng);
			var name = "link";
			var recents = '<a href="/recent?lat=' + lt + '&lon=' + lg + '&dist=40&back=3' + '">' + "Recent" + '</a>' + '<p>';
			var checklists = '<a href="/checklist2?lat=' + lt + '&lon=' + lg + '">' + "Checklists (US Only)" + '</a>' + '<p>';
			var specieslistlink = '<a href="/species?lat=' + lt + '&lon=' + lg + '">' + "Species List (US Only)" + '</a>' + '<p>';
			var hotspots = '<a href="/hotspot?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Hotspot List" + '</a>' + '<p>';
			var notable = '<a href="/notable?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Notable List (US Only)" + '</a>' + '<p>';

			var displaylinks = recents + checklists + specieslistlink + hotspots + notable;

			var popup = L.popup().setLatLng(e.latlng).setContent(displaylinks).openOn(mymap);

		});


	</script>
	<pre>


</pre>
</body>

</html>
