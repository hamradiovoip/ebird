<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
	<title>Custom Hotspot List</title>

	<!-- Pulls in all CSS assets from the layout file  -->
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>
	<th:block th:replace="~{fragments/styles :: map-styles}"></th:block>
	<th:block th:replace="~{fragments/bootstrap :: bootstrap-assets}"></th:block>
	<th:block th:replace="~{fragments/jquery :: jquery-assets}"></th:block>


</head>

<body style="margin:30;padding:2">

	<div th:replace="~{fragments/navbar}"></div>

	<center><span th:text="${title}" /> </center>

	<h5 th:text="${size}"></h5>
	<div id="mapid" th:attr="style=${mapsize}"></div>

	<script th:inline="javascript">
		var mylat = [[${lat}]];
		var mylon = [[${lon}]];
		var zoom = [[${zoom}]];
		var data = [[${pointList}]];
		var dist = [[${dist}]];
		var back = [[${back}]];


		var mymap = L.map('mapid').setView([mylat, mylon], zoom);

		new L.tileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 20
		}).addTo(mymap);

		L.marker([mylat, mylon]).addTo(mymap).bindPopup('center');


		for (var i = 0; i < data.length; i++) {

			if (data[i].lat !== null && data[i].lon !== "") {

				L.marker([data[i].lat, data[i].lon]).addTo(mymap)
					.bindPopup(data[i].textDescription + '<p>' +
						'<a href="' + data[i].url + '"  target="_blank">' + data[i].url + '</a><p>');
			}
		}



	</script>
	<pre>


</pre>
</body>

</html>
