<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
	<title>Region Specices Obs Form</title>


	<!-- Pulls in all CSS assets from the layout file  -->
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>
	<th:block th:replace="~{fragments/styles :: map-styles}"></th:block>
	<th:block th:replace="~{fragments/bootstrap :: bootstrap-assets}"></th:block>

	<th:block th:replace="~{fragments/jquery :: jquery-assets}"></th:block>


	<script type="text/javascript">
		$(function () {
			$("#Bird_Name").autocomplete({
				source: "/lookup",
				minLength: 3,
				select: function (event, ui) {
					this.value = ui.item.label;
					$("#Bird_Id").val(ui.item.value);
					return false;
				}
			});
		});
	</script>



	<script type="text/javascript">
		$(function () {
			$("#Region").autocomplete({
				source: "/lookupstate",
				minLength: 3,
				select: function (event, ui) {
					this.value = ui.item.label;
					$("#Region_Id").val(ui.item.value);
					return false;
				}
			});
		});
	</script>

</head>

<body style="margin:30;padding:2">

	<div th:replace="~{fragments/navbar}"></div>
	<p>
		<!-- TODO
		Sample observations<br>
		<a href="/recentregionspecies?lat=39.4798135%20&lon=-77.6325412&region=US-MD&species=scatan"> Scarlet Tanager Observations</a>
	<P>

		<a href="/recentregionspecies?lat=39.4798135%20&lon=-77.6325412&region=US-MD&species=camwar"> Cape May Warbler Observations </a>


		-->
	<form action="#" th:action="@{/showspecies}" th:object="${species}" enctype="multipart/form-data" method="POST"><br />


		<div class="input-group input-group-sm mb-3">
			<div class="input-group-prepend">
				<span class="input-group-text" id="Region">Region ie US-MD</span>
			</div>

			<input id="Region" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" name="Region" th:field="*{region}" />
		</div>

		<div class=" input-group input-group-sm mb-3">
			<div class="input-group-prepend">
				<span class="input-group-text" id="bird">Bird (Common Name)</span>
			</div>
			<input id="Bird_Name" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" name="birdName" th:field="*{comName}" />
		</div>


		<div class=" input-group input-group-sm mb-3">
			<div class="input-group-prepend">
				<span class="input-group-text" id="bird">Days</span>
			</div>
			<input id="days" type="number" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" th:field="*{days}" />
		</div>


		<div class=" input-group input-group-sm mb-3">
			<div class="input-group-prepend">
				<span class="input-group-text" id="bird">Max</span>
			</div>
			<input id="max" type="number" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" name="max" th:field="*{maxResults}" />
		</div>



		<div class=" input-group input-group-sm mb-3">
			<div class="input-group-prepend">
				<span class="input-group-text" id="bird">Adjacent Regions (TODO)</span>
			</div>

			<input id="adjacent" type="checkbox" th:checked="*{adjacent}" />

		</div>

		<button name=" submit" type="submit" value="0">Submit</button>

		<!--		<input id="Bird_Id" type="hidden" name="speciesCode" th:field="*{speciesCode}" />
		<input id="Region_Id" type="hidden" name="region" th:field="*{region}" />-->

	</form>



	<pre>

</pre>


</body>

</html>
