<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />

	<title>eBird Hotspots Query</title>


	<!-- Pulls in all CSS assets from the layout file  -->
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>
	<th:block th:replace="~{fragments/styles :: map-styles}"></th:block>
	<th:block th:replace="~{fragments/bootstrap :: bootstrap-assets}"></th:block>

	<th:block th:replace="~{fragments/jquery :: jquery-assets}"></th:block>


</head>

<body style="margin:30;padding:2">

	<div th:replace="~{fragments/navbar}"></div>
	<p>


	<h5 th:text="${title}"></h5>

	<table style="width:85%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>
				<th>Location</th>
			</tr>
		</thead>
		<tbody>

			<tr th:each="prop:${prop}">
				<td>
					<a th:href="@{/hotspot(lat=${prop.latitude},lon=${prop.longitude},dist=${prop.distance},back=${prop.back})}" th:text="${prop.locName}">${prop.locName}</a>
				</td>
			</tr>
		</tbody>
	</table>
	<pre>

</pre>
	<hr>
	<pre>

		</pre>

	<h4>Or Select a State:</h4>
	<form action="#" th:action="@{/showhotspot}" th:object="${hotspot}" enctype="multipart/form-data" method="POST"><br />

		<select id="Region" name="region">

			<option value="">-- Select --</option>
			<option th:each="option : ${dropdownOptions}" th:text="${option}" th:value="${option}" th:object="${hotspot}">
			</option>

		</select>
		<div class=" input-group input-group-sm mb-3">
			<div class="input-group-prepend">
				<span class="input-group-text" id="bird">Days</span>
			</div> <input id="days" type="number" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" th:field="*{days}" />
		</div>


		<button name="submit1" type="submit" value="0">Submit</button>

	</form>


	<hr>

	<h4>Other regions</h4>
	<p>

		<body>
			<form action="#" th:action="@{/showhotspot}" th:object="${hotspot}" enctype="multipart/form-data" method="POST"><br />


				<div class="input-group input-group-sm mb-3">
					<div class="input-group-prepend">
						<span class="input-group-text" id="Region">Region</span>
					</div>

					<input id="Region" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" name="Region" th:field="*{region}" />
				</div>


				<div class=" input-group input-group-sm mb-3">
					<div class="input-group-prepend">
						<span class="input-group-text" id="bird">Days</span>
					</div> <input id="days" type="number" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-sm" th:field="*{days}" />
				</div>

				<div class=" input-group input-group-sm mb-3">
					<div class="input-group-prepend">
						<span class="input-group-text" id="bird">Adjacent Regions</span>
					</div>

					<input id="adjacent" type="checkbox" th:checked="*{adjacent}" />

				</div>

				<button name=" submit" type="submit" value="0">Submit</button>

			</form>

</html>
