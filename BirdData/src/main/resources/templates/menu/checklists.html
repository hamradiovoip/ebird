<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
	
	<title>Local Checklists</title>


	<!-- Pulls in all CSS assets from the layout file  -->
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>
	<th:block th:replace="~{fragments/styles :: map-styles}"></th:block>
	<th:block th:replace="~{fragments/bootstrap :: bootstrap-assets}"></th:block>

</head>

<body style="margin:30;padding:2">

	<div th:replace="~{fragments/navbar}"></div>
	<p>

	<h5 th:text="${title}"></h5>

	<table style="width:85%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>
				<th>Location </th>
			</tr>
		</thead>
		<tbody>

			<tr th:each="prop:${prop}">
				<td>
					<a th:href="@{/checklist2(lat=${prop.latitude},lon=${prop.longitude},dist=${prop.distance},back=${prop.back})}" th:text="${prop.locName}">${prop.locName}</a>
				</td>
			</tr>
		</tbody>
	</table>



	<pre>

 </pre>


</body>

</html>
