	<h5 th:text="${title}"></h5>

	<table style="width:85%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>
				<th>Location </th>

			</tr>
		</thead>
		<tbody>

		<tr th:each="prop:${prop}">			
		<td>						
			<a th:href="@{/recent(lat=${prop.latitude},lon=${prop.longitude},dist=${prop.distance},back=${prop.back})}"
			   th:text="${prop.locName}">${prop.locName}</a> 			 
		</td>
	</tr>
	</tbody>
	</table>

	
	
	
	
	
	
<pre>
	
</pre>

Get the list of recent observations (up to 30 days ago) of birds seen in a country, state, 
county, or location. Results include only the most recent observation for each species in the region specified.
