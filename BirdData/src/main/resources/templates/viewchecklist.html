<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	
	<title>Local eBird Lists of Checklist</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ==" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js" integrity="sha512-gZwIG9x3wUXg2hdXF6+rVkLF/0Vi9U8D2Ntg4Ga5I5BZpVkVxlJWbSQtXPSiUTtC0TjtGOmxa1AJPuV0CPthew==" crossorigin=""></script>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

	<!--	<link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
	
	<link rel="stylesheet" href="/static/scripts/lib/leaflet/leaflet.css" />
	<script src="/static/scripts/lib/leaflet/leaflet.js"></script>
	-->

	<style>
		html,
		body {
			height: 100%;
			margin: 0;
		}

		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}

		.my-label {
			position: absolute;
			width: 100px;
			font-size: 20px;
		}
	</style>
</head>

<body style="margin:30;padding:2">
	<div th:replace="~{fragments/navbar}"></div>
eBird Link to Checklist: <td><a th:href="@{https://ebird.org/checklist/{id}(id=${subId})}" target="_blank" th:text="${subId}"></a> </td>
<p>
<pre>
	
	
</pre>
	
	
	<table style="width:85%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>


				<th>User Name</th>
				<th>Num Species</th>
				<th>Hours</th>
				<th>Distance (km)</th>
				<th>Num Observers</th>
				<th>Submission Method</th>
				<th>Comments</th>


			</tr>
		</thead>
		<tbody>

			<tr>

				<td th:text="${observation.userDisplayName}"></td>

				<td th:text="${observation.numSpecies}"></td>

				<td th:text="${observation.durationHrs}"></td>

				<td th:text="${observation.effortDistanceKm}"></td>

				<td th:text="${observation.numObservers}"></td>

				<td th:text="${observation.submissionMethodCode}"></td>

				<td th:text="${observation.comments}"></td>
			</tr>

		</tbody>
	</table>



	<table style="width:85%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>
				<th>Common Name</th>
				<th>Number Seen</th>
				<th>Date</th>
				<th>Comments</th>
			</tr>
		</thead>
		<tbody>

			<tr th:each="obs:${observation.obs}">

				<td><a th:href="@{https://ebird.org/species/{id}(id=${obs.speciesCode})}" target="_blank" th:text="${obs.commonName}"></a> </td>
				<td th:text="${obs.howManyStr}"></td>
				<td th:text="${obs.obsDt}"></td>
				<td th:text="${obs.comments}"></td>

			</tr>

		</tbody>
	</table>


	<div id="mapid" th:attr="style=${size}"></div>

	<!--<div id="mapid" style="width: 1000px; height: 800px;"></div>-->


	<script th:inline="javascript">
		var mylat = [[${lat}]];
		var mylon = [[${lon}]];
		var zoom = [[${zoom}]];
		var dist = [[${dist}]];
		var back = [[${back}]];

		var mymap = L.map('mapid').setView([mylat, mylon], zoom);

		new L.tileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 20
		}).addTo(mymap);

		L.marker([mylat, mylon]).addTo(mymap).bindPopup();


		mymap.on('click', function (e) {
			var lt = String(e.latlng.lat), lg = String(e.latlng.lng);
			var name = "link";
			var recents = '<a href="/recent?lat=' + lt + '&lon=' + lg + '&dist=20&back=5' + '">' + "Recent" + '</a>' + '<p>';
			var checklists = '<a href="/checklist2?lat=' + lt + '&lon=' + lg + '">' + "Checklists (US Only)" + '</a>' + '<p>';
			var specieslistlink = '<a href="/species?lat=' + lt + '&lon=' + lg + '">' + "Species List (US Only)" + '</a>' + '<p>';
			var hotspots = '<a href="/hotspot?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Hotspot List" + '</a>' + '<p>';
			var notable = '<a href="/notable?lat=' + lt + '&lon=' + lg + '&dist=' + dist + '&back=' + back + '">' + "Notable List (US Only)" + '</a>' + '<p>';
			var displaylinks = recents + checklists + specieslistlink + hotspots + notable;
			var popup = L.popup().setLatLng(e.latlng).setContent(displaylinks).openOn(mymap);

		});



	</script>
	<pre>


</pre>
</body>


</html>
