spring.application.name=BirdData
server.port=8088
spring.datasource.url=jdbc:mariadb://192.168.1.12:3306/ebird
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop
jakarta.persistence.jdbc.url=jdbc:mariadb://192.168.1.12:3306/ebird
api.key=NEED_YOUR_APIKEY_HERE
api.header=X-eBirdApiToken
url.recent=https://api.ebird.org/v2/data/obs/geo/recent?
url.hotspot=https://api.ebird.org/v2/ref/hotspot/geo?
url.notable=https://api.ebird.org/v2/data/obs/
url.ebird=https://api.ebird.org/

# set the dialect  
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

